name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: experthub_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"

    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/experthub_test
      REDIS_URL: redis://localhost:6379/1
      DEVISE_JWT_SECRET_KEY: test_secret_key_for_ci_only
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: testprimarykey12345678901234567890
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: testdeterministickey123456789012
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: testkeysalt1234567890123456789012

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.7"
          bundler-cache: true

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Run specs
        run: bundle exec rspec --format progress

      - name: Static security analysis (Brakeman)
        run: bundle exec brakeman -q --no-pager

      - name: Gem vulnerability audit
        run: bundle exec bundler-audit check --update
