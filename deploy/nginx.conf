# ExpertHub — single-host nginx for EC2 (React SPA + Rails API + ActionCable).
# Build frontend first: cd ../experthub-web && ./deploy/build-frontend.sh YOUR_ELASTIC_IP

upstream rails_api {
  server api:3000;
}

# GET paths that must hit Rails (not the SPA).
map $uri $api_get_path {
  default 0;
  ~*^/up$ 1;
  ~*^/me$ 1;
  ~*^/tenant$ 1;
  ~*^/services 1;
  ~*^/courses 1;
  ~*^/lessons 1;
  ~*^/group_sessions 1;
  ~*^/bookings 1;
  ~*^/experts 1;
  ~*^/notifications 1;
  ~*^/conversations 1;
  ~*^/analytics 1;
  ~*^/referrals 1;
  ~*^/reviews 1;
  ~*^/promo_codes 1;
  ~*^/checkout_fields 1;
  ~*^/categories 1;
  ~*^/payment_configs 1;
  ~*^/working_time_slots 1;
  ~*^/subscription_plans 1;
  ~*^/subscriptions 1;
  ~*^/booking_packages 1;
  ~*^/cancellation_policy 1;
  ~*^/pages/ 1;
  ~*^/admin/ 1;
  ~*^/webhooks/ 1;
  ~*^/billing/ 1;
  ~*^/ai/ 1;
  ~*^/expert_applications 1;
}

map $request_method $api_write {
  default 0;
  POST 1;
  PUT 1;
  PATCH 1;
  DELETE 1;
}

map "$api_get_path:$api_write" $proxy_api {
  "~^1:" 1;
  "~:1$" 1;
  default 0;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20M;

  root /usr/share/nginx/html;
  index index.html;

  location /cable {
    proxy_pass http://rails_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    if ($proxy_api) {
      return 418;
    }
    try_files $uri $uri/ /index.html;
  }

  location @rails {
    proxy_pass http://rails_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  error_page 418 = @rails;
}
