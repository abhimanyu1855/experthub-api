# ExpertHub — single-host nginx for EC2 (React SPA + Rails API + ActionCable).
# Build frontend first: cd ../experthub-web && ./deploy/build-frontend.sh YOUR_ELASTIC_IP

upstream rails_api {
  server api:3000;
}

# GET paths that must hit Rails (not the SPA).
map $uri $api_get_path {
  default 0;
  ~*^/up$ 1;
  ~*^/me$ 1;
  ~*^/tenant$ 1;
  ~*^/services 1;
  ~*^/courses 1;
  ~*^/lessons 1;
  ~*^/group_sessions 1;
  ~*^/bookings 1;
  ~*^/experts 1;
  ~*^/notifications 1;
  ~*^/conversations 1;
  ~*^/analytics 1;
  ~*^/referrals 1;
  ~*^/reviews 1;
  ~*^/promo_codes 1;
  ~*^/checkout_fields 1;
  ~*^/categories 1;
  ~*^/payment_configs 1;
  ~*^/working_time_slots 1;
  ~*^/subscription_plans 1;
  ~*^/subscriptions 1;
  ~*^/booking_packages 1;
  ~*^/cancellation_policy 1;
  ~*^/pages/ 1;
  ~*^/admin/ 1;
  ~*^/webhooks/ 1;
  ~*^/billing/ 1;
  ~*^/ai/ 1;
  ~*^/expert_applications 1;
  # Auth endpoints
  ~*^/login 1;
  ~*^/logout 1;
  ~*^/signup 1;
  ~*^/password 1;
  ~*^/confirmation 1;
  ~*^/users 1;
  # Active Storage — file uploads and downloads
  ~*^/rails/active_storage 1;
  ~*^/active_storage 1;
}

map $request_method $api_write {
  default 0;
  POST    1;
  PUT     1;
  PATCH   1;
  DELETE  1;
  OPTIONS 1;   # CORS preflight — must reach Rack::CORS in Rails
}

map "$api_get_path:$api_write" $proxy_api {
  "~^1:" 1;
  "~:1$" 1;
  default 0;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ────────────────────────────────────────────────────────
  # Prevent the page from being embedded in an iframe (clickjacking).
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Stop browsers from MIME-sniffing the content type.
  add_header X-Content-Type-Options "nosniff" always;

  # Control referrer information sent to third parties.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Disable browser features that aren't needed.
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

  # Legacy XSS protection for older browsers.
  add_header X-XSS-Protection "1; mode=block" always;

  # Content-Security-Policy:
  # - default-src 'self'        — only load resources from same origin by default
  # - script-src 'self' 'unsafe-inline'  — allow inline scripts (required by Vite SPA)
  # - connect-src 'self' *      — allow API calls and WebSocket to any origin (multi-tenant)
  # - img-src 'self' data: blob: https:  — images from self, data URIs, blobs, or HTTPS
  # - style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
  # - font-src 'self' https://fonts.gstatic.com
  # - frame-ancestors 'none'    — stronger clickjacking protection (modern browsers)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' *; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; frame-ancestors 'none'; object-src 'none';" always;
  # ─────────────────────────────────────────────────────────────────────────────

  location /cable {
    proxy_pass http://rails_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    if ($proxy_api) {
      return 418;
    }
    try_files $uri $uri/ /index.html;
  }

  location @rails {
    proxy_pass http://rails_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  error_page 418 = @rails;
}
