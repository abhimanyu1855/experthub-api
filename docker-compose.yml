# For local development: starts Postgres (with pgvector) + Redis alongside the Rails app.
#
# Start infrastructure only:
#   docker compose up -d postgres redis
#
# Then run Rails separately:
#   bin/rails server
#   bin/jobs
#
# No `web` service is defined here — run Rails directly for faster reloads.

services:
  postgres:
    image: ankane/pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: experthub_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
