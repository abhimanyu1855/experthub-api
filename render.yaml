# Render Blueprint — deploy via Dashboard → New → Blueprint
# Connect the experthub-api GitHub repo and Render will create both services.

envVarGroups:
  - name: experthub-env
    envVars:
      - key: RAILS_ENV
        value: production
      # Leave unset (or "false") until DATABASE_URL works and queue migrations have run.
      # - key: SOLID_QUEUE_IN_PUMA
      #   value: "true"
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        sync: false
      - key: QUEUE_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DEVISE_JWT_SECRET_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: APP_DOMAIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_EXTRA_ORIGINS
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "15"
      - key: SMTP_ADDRESS
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_DOMAIN
        sync: false
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: MAILER_FROM
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_STRIPE_SECRET_KEY
        sync: false
      - key: PLATFORM_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_SCALE_PRICE_ID
        sync: false
      - key: DAILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

services:
  - type: web
    name: experthub-api
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - fromGroup: experthub-env

# Background workers are NOT available on Render's free plan.
# Solid Queue runs inside Puma when SOLID_QUEUE_IN_PUMA=true (see config/puma.rb).
# To use a dedicated worker, upgrade to Render Starter ($7/mo) and uncomment:
#
#  - type: worker
#    name: experthub-worker
#    runtime: docker
#    plan: starter
#    dockerCommand: bin/jobs
#    envVars:
#      - fromGroup: experthub-env
